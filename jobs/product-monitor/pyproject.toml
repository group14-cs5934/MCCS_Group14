[project]
name = "mccs-product-monitor"
version = "0.1.0"
description = "Daily job that reads prices and stock from online store pages into the database."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.2.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
]

[tool.uv]
# A script, not an installable package.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
