# Lint and unit tests for the backend and mobile app. Runs on every pull request and on pushes
# to main. A failing check shows as a red X on the PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's in-progress run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      # Installs Python 3.13 (from .python-version) and the exact versions in uv.lock.
      - name: Install dependencies
        id: install
        run: uv sync --locked

      # The checks below run even if an earlier check fails, so one run reports every problem.
      - name: Lint (ruff check)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff format)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff format --check .

      - name: Unit tests (pytest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pytest

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      # The checks below run even if an earlier check fails, so one run reports every problem.
      - name: Lint (ESLint + Prettier)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Format check (Prettier)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Type check (tsc)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Unit tests (Jest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --ci
